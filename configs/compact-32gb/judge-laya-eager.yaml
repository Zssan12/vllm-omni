pipeline: aura_omni_judged
async_chunk: true
session_mode: duplex
duplex_session:
  max_sessions: 1
connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      codec_streaming: true
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 25
      codec_left_context_frames: 72
      initial_codec_chunk_frames: 8
      decode_cudagraph_capture_sizes:
      - 25
      - 73
      - 97
      - 169
      - 325
stages:
- stage_id: 0
  max_num_seqs: 1
  gpu_memory_utilization: 0.17
  enforce_eager: true
  trust_remote_code: true
  enable_prefix_caching: true
  async_scheduling: true
  max_model_len: 1024
  max_num_batched_tokens: 1024
  devices: '0'
  model: /path/to/models/Qwen3-ASR-1.7B
  default_sampling_params:
    temperature: 0.0
    top_p: 1.0
    top_k: -1
    max_tokens: 256
  engine_extras:
    kv_cache_memory_bytes: 201326592
    limit_mm_per_prompt:
      audio: 1
- stage_id: 1
  max_num_seqs: 1
  gpu_memory_utilization: 0.04
  enforce_eager: true
  trust_remote_code: true
  enable_prefix_caching: false
  async_scheduling: false
  max_model_len: 1024
  max_num_batched_tokens: 8192
  devices: '0'
  model: /path/to/models/laya-multilingual-vllm
  model_arch: LayaDecisionModel
  runner: pooling
  default_pooling_params:
    task: classify
  hf_overrides:
    laya_question_type: choice
    response_judge:
      format: laya
      question_type: choice
      instructions: Does the assistant need to answer?
      options:
        'yes': yes, answer the user
        'no': no, just keep listening
      reply_option: 'yes'
      threshold: 0.633
      state_template: 'The user just said to the voice assistant: "{transcript}"'
- stage_id: 2
  max_num_seqs: 1
  gpu_memory_utilization: 0.6
  enforce_eager: true
  trust_remote_code: true
  enable_prefix_caching: true
  async_scheduling: true
  max_model_len: 1024
  max_num_batched_tokens: 1024
  devices: '0'
  model: /path/to/models/AURA-88ee5506
  model_arch: AuraQwen3VLForConditionalGeneration
  default_sampling_params:
    temperature: 0.0
    top_p: 1.0
    top_k: -1
    max_tokens: 128
    repetition_penalty: 1.0
    stop_token_ids:
    - 151669
    - 151645
  engine_extras:
    kv_cache_memory_bytes: 268435456
    limit_mm_per_prompt:
      image: 0
      video: 1
    mm_processor_kwargs:
      max_pixels: 65536
  skip_mm_profiling: true
- stage_id: 3
  max_num_seqs: 1
  gpu_memory_utilization: 0.16
  enforce_eager: true
  trust_remote_code: true
  enable_prefix_caching: false
  async_scheduling: true
  max_num_batched_tokens: 1024
  max_model_len: 1024
  devices: '0'
  output_connectors:
    to_stage_4: connector_of_shared_memory
  model: /path/to/models/Qwen3-TTS-12Hz-1.7B-CustomVoice
  default_sampling_params:
    temperature: 0.5
    top_k: 50
    max_tokens: 240
    min_tokens: 8
    repetition_penalty: 1.05
    stop_token_ids:
    - 2150
  subtalker_sampling_params:
    do_sample: true
    temperature: 0.5
    top_k: 50
    top_p: 1.0
  engine_extras:
    kv_cache_memory_bytes: 134217728
- stage_id: 4
  max_num_seqs: 1
  gpu_memory_utilization: 0.05
  enforce_eager: true
  trust_remote_code: true
  enable_prefix_caching: false
  async_scheduling: true
  max_num_batched_tokens: 16384
  max_model_len: 16384
  devices: '0'
  input_connectors:
    from_stage_3: connector_of_shared_memory
  model: /path/to/models/Qwen3-TTS-12Hz-1.7B-CustomVoice
  default_sampling_params:
    temperature: 0.0
    top_p: 1.0
    top_k: -1
    max_tokens: 16384
    seed: 42
    repetition_penalty: 1.0
dtype: bfloat16
